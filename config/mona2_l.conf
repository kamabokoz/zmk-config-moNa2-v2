#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_OWN_THREAD=y
CONFIG_EC11_THREAD_PRIORITY=7
CONFIG_EC11_THREAD_STACK_SIZE=2048

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#Kscan Diagnostics ----------------
# 周辺側 (左手) でもキー統計を収集し、中央側 (右手) 経由で DYA Studio に返す。
# CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN は左右で同じ値にする必要がある。
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256

#Watchdog -------------------------
# 周辺側 (左手) も自分自身のインシデントを記録する。
# 中央側から中継して DYA Studio の「安定性」タブで
# "Peripheral" を選ぶと参照できる。
CONFIG_ZMK_WATCHDOG=y

#BLE controller -------------------
# BT 切り替え時などに "Kernel Oops (3) / thread: idle" で落ちる対策。
# 落ちていたのは Zephyr BLE コントローラ lll_adv.c の prepare_cb 内
# LL_ASSERT_OVERHEAD (ログ: "prepare_cb: Actual EVENT_OVERHEAD_START_US = ...")。
# 無線イベントの準備 ISR が想定より遅れて呼ばれると assert で k_oops する。
# 無効にすると遅れたイベントはクラッシュせずスキップされる
# (連続して全イベントが遅れない限り接続は維持される)。
# NOTE: 下の設定は Zephyr の "Advanced features" メニュー内にあり、
#       BT_CTLR_ADVANCED_FEATURES=y が無いと =n が無視されて既定の y のままになる
#       (eedf551 のビルドでは実際に assert が残っていた)。
#       ADVANCED_FEATURES 自体はメニューを表示するだけで、他の既定値は変わらない。
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
